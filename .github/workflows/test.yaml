name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: arc-runner-set
    container:
      image: bubatzlegal/tpmsfe:cicd
    steps:
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
            export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TPMSFE_KEEPASSXC_PASSWORD: "op://tpmsfe/KeePassXC/password"
          TPMSFE_OP_CONNECT_TOKEN: "op://tpmsfe/tpmsfe-test Connect Token: tpmsfe-test/credential"
          TPMSFE_OP_CONNECT_HOST: "op://tpmsfe/tpmsfe-test Connect Token: tpmsfe-test/endpoint"
          TPMSFE_OP_SERVICE_ACCOUNT_TOKEN: "op://tpmsfe/Service Account Auth Token: TPMSFE-Test/credential"
          SETUP_BW_USERNAME: "op://tpmsfe/Vaultwarden/username"
          SETUP_BW_PASSWORD: "op://tpmsfe/Vaultwarden/password"
          SETUP_BW_SERVER: "op://tpmsfe/Vaultwarden/website"
    
      - name: Create Bitwarden Session
        run: |
          bw config server ${{ steps.op-load-secret.outputs.SETUP_BW_SERVER }}
          echo "TPMSFE_BW_SESSION=$(bw login "${{ steps.op-load-secret.outputs.SETUP_BW_USERNAME }}" "${{ steps.op-load-secret.outputs.SETUP_BW_PASSWORD }}" --raw)" >> $GITHUB_ENV
          bw sync

      - name: Run go (automated) tests
        run: go test ./tests/automatic

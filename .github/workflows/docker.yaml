name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/test.yaml'
      - '**.md'
      - '.gitignore'

jobs:
  docker:
    runs-on: arc-runner-set
    strategy:
      matrix:
        context:
          - custom
          - tofu
          - minimal
          - cicd
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load Docker credentials from 1Password
        uses: 1password/load-secrets-action@v2
        id: op-load-secret
        with:
            export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCKERHUB_USER: op://GitHub-Actions/dockerhub-tpmsfe/username
          DOCKERHUB_TOKEN: op://GitHub-Actions/dockerhub-tpmsfe/password

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.op-load-secret.outputs.DOCKERHUB_USER }}
          password: ${{ steps.op-load-secret.outputs.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.context }}.Dockerfile
          push: true
          tags: bubatzlegal/tpmsfe:${{ matrix.context }}
